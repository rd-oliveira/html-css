<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>

<body>
    <h1>Exemplo de Formulários</h1>

    <form action="cadastro.php" method="get" autocomplete="on" onreset="limpar()">
        <p>
            <label for="iano">Em que ano você nasceu?</label>
            <input type="number" name="ano" id="iano" min="1900" max="2025" value="2000" oninput="calcIdade()">
        </p>

        <p>
            <label for="iidade">Sua idade é:</label>
            <output id="iidade">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
    <script>
        function calcIdade() {
            let ano_atual = new Date().getFullYear();
            let ano_nascimento = document.getElementById('iano').value;
            let idade = Number(ano_atual) - parseInt(ano_nascimento);

            document.getElementById('iidade').innerHTML = idade;
        }

        function limpar() {
            document.getElementById('iidade').textContent = '0';
        }
    </script>
</body>

</html>
